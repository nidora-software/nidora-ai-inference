# Declarative model manifest.
#
# Each entry maps a name -> where the files come from.
#   source:           a HuggingFace repo id ("org/repo") OR a local path.
#   revision:         optional git revision pin for HF repos.
#   allow_patterns /  optional glob filters for HF downloads — fetch only what
#   ignore_patterns:  the profiles actually use.
#
# Names resolve to {NIDORA_MODELS_DIR}/{name} unless `source` is a local path.
# Nothing downloads implicitly: place files manually, or run
#   nidora-ai-inference download --all
# (or set NIDORA_AUTO_DOWNLOAD=1 on cloud pods).

models:
  # Pipeline scaffolding: text encoder, VAE, tokenizer, scheduler + the
  # transformer configs. The fp32 transformer weights (2x57 GB) are skipped —
  # the default profile replaces them with GGUF quants. Remove
  # ignore_patterns if you want the full-precision experts.
  wan22-i2v-a14b:
    source: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"
    ignore_patterns:
      - "transformer/*.safetensors"
      - "transformer_2/*.safetensors"

  # Q6_K-quantized experts (~12 GB each) — matches the ComfyUI template.
  wan22-i2v-gguf:
    source: "QuantStack/Wan2.2-I2V-A14B-GGUF"
    allow_patterns:
      - "HighNoise/Wan2.2-I2V-A14B-HighNoise-Q6_K.gguf"
      - "LowNoise/Wan2.2-I2V-A14B-LowNoise-Q6_K.gguf"

  # Lightning 4-step distill LoRAs (Seko V1).
  wan22-lightning:
    source: "lightx2v/Wan2.2-Lightning"
    allow_patterns:
      - "Wan2.2-I2V-A14B-4steps-lora-rank64-Seko-V1/*"

  # Alternative distill LoRAs (older default of this project).
  lightx2v-distill:
    source: "lightx2v/Wan2.2-Distill-Loras"
    allow_patterns:
      - "*i2v*rank64*4step*.safetensors"

  flux-dev:
    source: "black-forest-labs/FLUX.1-dev"
