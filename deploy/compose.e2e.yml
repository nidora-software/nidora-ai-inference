# End-to-end harness: gateway + agent + a fake SGLang, no GPU and no CUDA image.
#
# Exercises the real code on all three sides — the same gateway image that runs
# in production, the same agent that ships inside the GPU image — against a
# stand-in for the only part that needs an H100.
#
#   docker compose -f deploy/compose.e2e.yml up --build -d
#   ./test/e2e/run.sh
#   docker compose -f deploy/compose.e2e.yml down -v
name: nidora-inference-e2e

services:
  gateway:
    build:
      context: ../gateway
    environment:
      PORT: "8080"
      DATA_DIR: /data
      GATEWAY_API_KEYS: e2e-api-key
      AGENT_SHARED_SECRET: e2e-agent-secret
      LOG_LEVEL: info
      # Short windows so the harness finishes in seconds rather than minutes.
      MAX_POLL_WAIT_S: "5"
      LEASE_TTL_S: "30"
      JOB_TTL_S: "120"
      REAPER_INTERVAL_S: "2"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - e2e-data:/data

  mock-sglang:
    build:
      context: ../tools/mock-sglang
    environment:
      MOCK_DELAY_S: "1"
      # Set MOCK_READY_AFTER_S to rehearse the ~10 minute model load: the
      # gateway must hold jobs in the queue rather than dispatching to a pod
      # whose server is not warm yet.
      MOCK_READY_AFTER_S: "0"

  agent:
    build:
      context: ..
      dockerfile: deploy/agent-only.Dockerfile
    depends_on: [gateway, mock-sglang]
    environment:
      GATEWAY_URL: http://gateway:8080
      GATEWAY_AGENT_SECRET: e2e-agent-secret
      SGLANG_URL: http://mock-sglang:8000
      POD_ID: e2e-pod-1
      AGENT_PIPELINES: wan22-i2v
      AGENT_MAX_IN_FLIGHT: "1"
      AGENT_POLL_WAIT_S: "5"
      AGENT_LOG_LEVEL: INFO

volumes:
  e2e-data:
