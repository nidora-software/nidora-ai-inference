[project]
name = "nidora-ai-inference"
version = "0.1.0"
description = "Self-hosted AI inference API — image-to-video (Wan 2.2 + Lightx2v LoRAs) and friends, built on diffusers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "huggingface_hub[hf_transfer]>=0.34",
    "diffusers>=0.35",
    "transformers>=4.48",
    "accelerate>=1.0",
    "peft>=0.14",
    "torch>=2.4",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# GPU acceleration extras — never required. NOTE: diffusers' sage backend
# needs sageattention>=2.1.1, which is NOT on PyPI (source build from
# thu-ml/SageAttention, requires nvcc) — see README. The 1.x PyPI package is
# too old and is deliberately not listed here.
accel = [
    "triton>=3.0 ; sys_platform == 'linux'",
]

[project.scripts]
nidora-ai-inference = "nidora_ai_inference.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nidora_ai_inference"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-m 'not gpu'"
markers = [
    "gpu: tests that need a CUDA GPU and real model weights (deselected by default)",
]
testpaths = ["tests"]
