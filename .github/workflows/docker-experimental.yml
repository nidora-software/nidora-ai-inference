name: Build experimental (nightly-based) image

on:
  push:
    branches: [main]
    paths: ["Dockerfile.nightly", "scripts/docker-entrypoint.sh"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules /opt/microsoft /usr/local/.ghcup
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nightly
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:experimental
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nidora-ai-inference:experimental
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-experimental
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-experimental,mode=max
