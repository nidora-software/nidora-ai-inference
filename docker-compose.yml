# Local dockerized run mirroring the rental-pod flow (needs an 80 GB GPU):
#   docker compose up --build
# NOTE: the API has no built-in auth — bind to localhost only.
services:
  inference:
    build: .
    image: nidora-ai-inference:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: ${MODEL_PATH:?MODEL_PATH is required}
      LORA_PATH: ${LORA_PATH:-}
      SGLANG_EXTRA_ARGS: ${SGLANG_EXTRA_ARGS:-}
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    volumes:
      - ./workspace:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
