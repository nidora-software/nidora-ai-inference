# Local dockerized run mirroring the rental-pod flow (needs an 80 GB GPU):
#   API_KEY=change-me docker compose up --build
services:
  inference:
    build: .
    image: nidora-ai-inference:local
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?set API_KEY}
      SGLANG_EXTRA_ARGS: ${SGLANG_EXTRA_ARGS:-}
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    volumes:
      - ./workspace:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
